<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parfum Shop — Магазин парфюмерии</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="container header__inner">
    <div class="logo">✨ <span>Parfum</span> Shop</div>
    <button id="cartBtn" class="cart-btn">
      <span class="cart-btn__icon">🛍️</span> Корзина <span id="cartCount" class="cart-count">0</span>
    </button>
  </div>
</header>

<section class="hero">
  <div class="container hero__inner">
    <h1 class="hero__title">Мир изысканных ароматов</h1>
    <p class="hero__subtitle">Оригинальная парфюмерия премиум-класса с доставкой. Каждый аромат подобран вручную.</p>
  </div>
</section>

<main class="container">
  <div id="statusMsg" class="status-msg"></div>
  <section id="productGrid" class="product-grid"></section>
</main>

<footer class="footer">
  <div class="container">
    <p>© 2025 Parfum Shop. Все ароматы оригинальные, с сертификатом подлинности.</p>
  </div>
</footer>

<!-- Корзина -->
<div id="cartModal" class="modal hidden">
  <div class="modal__content">
    <button class="modal__close" data-close="cartModal">&times;</button>
    <h2>Ваша корзина</h2>
    <div id="cartItems" class="cart-items"></div>
    <div class="cart-total">Итого: <span id="cartTotal">0</span> ₽</div>
    <button id="checkoutBtn" class="btn btn-primary" disabled>Оформить заказ</button>
  </div>
</div>

<!-- Оформление заказа -->
<div id="orderModal" class="modal hidden">
  <div class="modal__content">
    <button class="modal__close" data-close="orderModal">&times;</button>
    <h2>Оформление заказа</h2>
    <form id="orderForm">
      <label>ФИО *
        <input type="text" id="orderName" required placeholder="Иванов Иван Иванович">
      </label>
      <label>Телефон *
        <input type="tel" id="orderPhone" required placeholder="+7 (___) ___-__-__">
      </label>
      <label>Удобный мессенджер / комментарий
        <textarea id="orderComment" placeholder="Например: WhatsApp, после 18:00"></textarea>
      </label>
      <div id="orderSummary" class="order-summary"></div>
      <button type="submit" class="btn btn-primary" id="orderSubmitBtn">Отправить заявку</button>
    </form>
  </div>
</div>

<!-- Тост-уведомления -->
<div id="toast" class="toast hidden"></div>

<template id="productCardTpl">
  <article class="product-card">
    <div class="product-card__img-wrap">
      <img class="product-card__img" src="" alt="">
      <span class="product-card__volume-badge"></span>
    </div>
    <div class="product-card__body">
      <div class="product-card__brand"></div>
      <h3 class="product-card__name"></h3>
      <div class="product-card__notes"></div>
      <div class="product-card__footer">
        <div class="product-card__price"></div>
        <button class="btn btn-add">В корзину</button>
      </div>
    </div>
  </article>
</template>

<template id="skeletonTpl">
  <div class="product-card product-card--skeleton">
    <div class="skeleton skeleton--img"></div>
    <div class="product-card__body">
      <div class="skeleton skeleton--line" style="width:40%"></div>
      <div class="skeleton skeleton--line" style="width:70%;height:18px"></div>
      <div class="skeleton skeleton--line" style="width:90%"></div>
      <div class="skeleton skeleton--line" style="width:50%;height:30px;margin-top:10px"></div>
    </div>
  </div>
</template>

<script src="app.js"></script>
</body>
</html>
